# dsh-pozhenz bundle patch（破阵子：dsh-purge 全家桶的本地化继任者）
#
# 清洗 + 演练台都在本插件内（lib/redteam、presets/redteam、skills/redteam）。
# 只装 dsh-pozhenz，不外接、不 link 其它红队包。
# 引擎内部身份（提示词段名 dsh-purge、状态目录 $DSH_HOME/dsh-purge、HTTP 路由
# /dsh-purge/*、宿主补丁标记 [dsh-purge]）刻意保持不变：那是补丁识别锚点，
# 改了会让已有的宿主补丁和状态记录全部失联。

# 关掉旧的独立红队包行（若用户以前装过 dsh-redteam-mode）
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: ""

# 本体 insert 写在用户层 profile/cordis.patch.yml（postinstall / 演练台自愈补）。
# 这里只改已入队条目的 inject/config。再 insert 一次会 already queued（#152 / #154 / #159）。
- id: dsh-pozhenz
  name: dsh-pozhenz
  inject: [systemPrompt, tools]
  config:
    enabled: true
    autoApplyOnStart: false
    autoUpdateOnStart: false
    autoRevertOnMissing: false
    injectOnce: false
    stripMnemon: true
    verbose: false
    postPrompt: ""
    postPromptOrder: 5100
    autoRetry: true
    retryMax: 3
    autoContinue: false
    continueMax: 3
    continueText: "继续"
    capabilityProtocol: true
    hooksDenyBypass: true

- insert:
    # 演练台：预设 + 技能落地（本插件 lib/redteam）
    - id: dsh-pozhenz-redteam
      name: dsh-pozhenz/redteam

    # 演练台事实库（SQLite），数据在 $DSH_HOME/redteam
    - id: dsh-pozhenz-redteam-store
      name: dsh-pozhenz/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # 演练台 HTTP 桥 POST /redteam/api
    - id: dsh-pozhenz-redteam-ui
      name: dsh-pozhenz/redteam/ui
